    <script>
        function checkFollowers() {
            const fileInput1 = document.getElementById('fileInput');
            const fileInput2 = document.getElementById('fileInput2');

            if (fileInput1.files.length === 0 || fileInput2.files.length === 0) {
                alert('두 개의 JSON 파일을 모두 업로드해주세요.');
                return;
            }

            const reader1 = new FileReader();
            const reader2 = new FileReader();

            reader1.onload = function(event) {
                const followersData = JSON.parse(event.target.result);
                reader2.onload = function(event) {
                    const followingData = JSON.parse(event.target.result);
                    console.log('Followers:', followersData);
                    console.log('Following:', followingData);

                    //console.log(followersData[0]['string_list_data'][0]['value']);
                    //console.log(followersData[0]['string_list_data'][0]['href']);
                    //console.log(followersData[0]['string_list_data'][0]['timestamp']);
                    //console.log(followingData['relationships_following'][0]['title']);
                    //console.log(followingData['relationships_following'][0]['string_list_data'][0]['href']);
                    //console.log(followingData['relationships_following'][0]['string_list_data'][0]['timestamp']);

                    const followersSet = new Set(followersData.map(follower => follower['string_list_data'][0]['value']));
                    const notFollowingBack = followingData['relationships_following'].filter(following => !followersSet.has(following['title']));
                    const notFollowingBackList = notFollowingBack.map(following => ({
                        title: following['title'],
                        href: following['string_list_data'][0]['href'],
                        timestamp: following['string_list_data'][0]['timestamp']
                    }));
                    //console.log('Not Following Back:', notFollowingBack);

                    const unfollowerListDiv = document.getElementById('unfollowerlist');
                    unfollowerListDiv.innerHTML = ''; // Clear previous results
                    notFollowingBackList.forEach(user => {
                        const userElement = document.createElement('label');
                        const date = new Date(user.timestamp * 1000); // Convert timestamp to milliseconds
                        const formattedDate = `${date.getFullYear()}-${(date.getMonth() +1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
                        userElement.innerHTML = `<p style="font-size: 1.5vw"><input style="transform: scale(1.5);" name="unfollowers" type="checkbox"> <a style="color:#ffffff; text-decoration: none;" href="${user.href}" target="_blank">${user.title} (<span>${formattedDate}</span>)</a></p>`;
                        unfollowerListDiv.appendChild(userElement);
                    });
                };
                reader2.readAsText(fileInput2.files[0]);
            };
            reader1.readAsText(fileInput1.files[0]);
        }

        function copySelectedUserIds() {
            const checkboxes = document.querySelectorAll('input[name="unfollowers"]:checked');
            const selectedUserIds = Array.from(checkboxes).map(checkbox => {
                const userLink = checkbox.nextElementSibling;
                return userLink.textContent.split(' ')[0]; // Get the username part
            });
            const userIdsString = '@' + selectedUserIds.join(' @');

            // Create a temporary textarea to copy the text
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = userIdsString;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextarea);

            alert('선택된 유저 아이디가 복사되었습니다');
        }

        function selectAllCheckboxes() {
            const checkboxes = document.querySelectorAll('input[name="unfollowers"]');
            checkboxes.forEach(checkbox => checkbox.checked = true);
        }

        function deselectAllCheckboxes() {
            const checkboxes = document.querySelectorAll('input[name="unfollowers"]');
            checkboxes.forEach(checkbox => checkbox.checked = false);
        }
